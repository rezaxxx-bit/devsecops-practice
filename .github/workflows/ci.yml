name: CI Pipeline

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: pytest
      env:
        PYTHONPATH: .

    - name: Static Security Analysis (Bandit)
      run: bandit -r src -ll

  container-security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t devsecops-app:latest .

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-app:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'HIGH,CRITICAL'

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog-action@main
      with:
        extra_args: --debug --only-verified

  dast-scan:
    runs-on: ubuntu-latest
    needs: container-security
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build and Run Application Container
      run: |
        docker build -t devsecops-app:latest .
        docker run -d -p 5000:5000 --name running-app devsecops-app:latest
        sleep 5

    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:5000'
        fail_action: false