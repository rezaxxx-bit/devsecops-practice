name: CI Pipeline

on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: pytest
      env:
        PYTHONPATH: .

    - name: Static Security Analysis (Bandit)
      run: bandit -r src -ll

  container-security:
    runs-on: ubuntu-latest
    needs: build-test  # Dijalankan setelah build-test sukses
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t devsecops-app:latest .

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-app:latest'
        format: 'table'
        exit-code: '0' # Ubah ke '1' jika ingin menghentikan pipeline saat ada High/Critical vulnerability
        ignore-unfixed: true
        severity: 'HIGH,CRITICAL'